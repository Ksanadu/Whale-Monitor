name: Whale Windows Release

on:
  push:
    branches: [whale-desktop, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whale-windows-release
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'Ksanadu/Whale-Monitor'
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Set increasing stable desktop version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | Set-Content -Path published-releases.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node scripts/next-whale-version.js published-releases.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WHALE_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm run lint
      - name: Verify desktop and updater regressions
        run: node --test tests/electron/whale*.test.js tests/electron/aboutSettings.test.js tests/electron/appUpdateState.test.js tests/electron/appUpdatePresentation.test.js tests/electron/updateInstallQuit.test.js tests/electron/tray.test.js tests/electron/windowLifecycle.test.js tests/electron/statsRenderScheduler.test.js tests/shared/codexLocalUsage.test.js tests/shared/codexSessionActivity.test.js
      - run: npm run dist:whale:win
      - name: Verify installer hashes and update channels
        run: node scripts/verify-whale-release.js
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:WHALE_BUILD_VERSION
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          $notes = "Windows x64 独立小鲸鱼桌宠正式版。`n`n- 修复 Codex 长时间对话、恢复历史会话后完成却不播报的问题。Windows 写句柄未关闭时文件修改时间可能保持旧值，现在通过近期会话索引发现日志，再核验日志中的成功完成事件。`n- 会话索引更新不会直接触发播报，保留根任务校验、错误/取消/子任务过滤与持久化去重。`n- 兼容 Codex 秒级完成时间、Windows 转义启动参数与 OpenCode 2 succeeded 状态。`n- 支持 Codex、OpenCode、ZCode 和 Antigravity 本机成功任务提醒，复用现有音效、音量和气泡设置，无需 DSH 后端。`n- 未知本轮 Token 显示「—」，保持用量统计独立。`n- 安装版自动更新；便携版打开最新 Release 页面。`n`n源提交：$env:GITHUB_SHA`n`n来源规则和限制见 docs/whale-completions.md。"
          $notes | Set-Content -Path release-notes.txt -Encoding utf8
          $assets = @(
            "dist/whale/Whale-Monitor-$version-x64-nsis.exe",
            "dist/whale/Whale-Monitor-$version-x64-portable.exe",
            "dist/whale/Whale-Monitor-$version-x64-nsis.exe.blockmap",
            'dist/whale/whale.yml', 'dist/whale/latest.yml', 'dist/whale/SHA256SUMS.txt'
          )
          gh release create $tag --repo $repo --target $env:GITHUB_SHA --title "Whale Monitor $version" --draft --notes-file release-notes.txt @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $repo --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
