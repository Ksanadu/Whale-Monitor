name: Whale Windows Release

on:
  push:
    branches: [whale-desktop, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whale-windows-release
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'Ksanadu/Whale-Monitor'
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Set increasing stable desktop version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | Set-Content -Path published-releases.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node scripts/next-whale-version.js published-releases.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WHALE_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm run lint
      - name: Verify desktop and updater regressions
        run: node --test tests/electron/whale*.test.js tests/electron/aboutSettings.test.js tests/electron/appUpdateState.test.js tests/electron/appUpdatePresentation.test.js tests/electron/updateInstallQuit.test.js tests/electron/tray.test.js tests/electron/windowLifecycle.test.js tests/electron/statsRenderScheduler.test.js tests/shared/codexLocalUsage.test.js tests/shared/codexSessionActivity.test.js tests/shared/sessionContext.test.js tests/shared/codexWaiting.test.js
      - run: npm run dist:whale:win
      - name: Verify installer hashes and update channels
        run: node scripts/verify-whale-release.js
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:WHALE_BUILD_VERSION
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          $notes = "Windows x64 独立小鲸鱼桌宠正式版。`n`n- 修复 Codex 任务完成能播报但本轮 Token 显示未知的问题。优先使用原生日志中与会话、任务 ID 匹配的本轮累计用量，首次对话和中途开始监测也能显示已有记录的完整用量。`n- 重复用量快照不重复累加；缓存输入和推理输出不重复计算，不以全局总量相减，避免多个任务串账。`n- 旧格式日志保留会话累计差，满足完整新会话证据时补齐零基线；确实缺少用量证据时继续显示「—」。`n- 保留 Codex 长会话旧文件时间兼容、错误/取消/子任务过滤及完成事件去重。`n- 支持 Codex、OpenCode、ZCode 和 Antigravity 的本机完成提醒，无需 DSH 后端。`n- 安装版自动更新；便携版打开最新 Release 页面。`n`n源提交：$env:GITHUB_SHA`n`n来源规则和限制见 docs/whale-completions.md。"
          $notes | Set-Content -Path release-notes.txt -Encoding utf8
          $assets = @(
            "dist/whale/Whale-Monitor-$version-x64-nsis.exe",
            "dist/whale/Whale-Monitor-$version-x64-portable.exe",
            "dist/whale/Whale-Monitor-$version-x64-nsis.exe.blockmap",
            'dist/whale/whale.yml', 'dist/whale/latest.yml', 'dist/whale/SHA256SUMS.txt'
          )
          gh release create $tag --repo $repo --target $env:GITHUB_SHA --title "Whale Monitor $version" --draft --notes-file release-notes.txt @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $repo --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
